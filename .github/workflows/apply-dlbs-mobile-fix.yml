name: Apply DLBS mobile fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_form = '<form id="student-login-form">'
          new_form = '<form id="student-login-form" novalidate>'
          if old_form in s:
              s = s.replace(old_form, new_form, 1)

          old_values = 'const name=document.getElementById("su")?.value.trim()||"", cls=document.getElementById("sc")?.value||"", pass=document.getElementById("sp")?.value||"";'
          new_values = '''const name=String(document.getElementById("su")?.value||"").trim(),
      cls=String(document.getElementById("sc")?.value||"").trim(),
      pass=String(document.getElementById("sp")?.value||"");'''
          if old_values in s:
              s = s.replace(old_values, new_values, 1)

          old_validation = '''if(!name||!cls||!pass){
      uiState.loginError="Enter the student's name, class, and password.";render();return false;
    }'''
          new_validation = '''if(!name||!cls||!pass){
      uiState.loginError=!name?"Enter the student's full name.":!cls?"Select the student's class.":"Enter the student's password.";
      render();
      setTimeout(()=>{
        const target=!name?document.getElementById("su"):!cls?document.getElementById("sc"):document.getElementById("sp");
        if(target){target.focus();if(target.select)target.select();}
      },0);
      return false;
    }'''
          if old_validation in s:
              s = s.replace(old_validation, new_validation, 1)

          mobile_css = r'''
/* ---- enhanced mobile experience ---- */
@media (max-width:600px){
  html,body{width:100%;overflow-x:hidden;}
  .landing{padding:22px 14px;justify-content:flex-start;padding-top:34px;overflow-y:auto;}
  .landing .role-grid,.landing .resource-grid{grid-template-columns:1fr!important;width:100%;max-width:520px;}
  .center-wrap{padding:16px 12px!important;min-height:100dvh;align-items:flex-start!important;}
  .login-card{width:100%!important;max-width:480px!important;margin:10px auto!important;padding:20px 16px!important;border-radius:12px;}
  .login-card h2{font-size:25px!important;}
  .login-logo{max-width:86px!important;height:auto;}
  .field{margin-bottom:14px;}
  .field input,.field select,.field textarea{width:100%;min-height:46px;font-size:16px!important;}
  .btn,.btn-primary,.btn-secondary{min-height:46px;width:100%;font-size:14px;}
  .shell{min-height:100dvh;display:block;}
  .sidebar{position:sticky!important;top:0;z-index:20;width:100%!important;height:auto!important;display:flex!important;flex-direction:row!important;align-items:stretch;gap:4px;overflow-x:auto;overflow-y:hidden;padding:8px 8px!important;-webkit-overflow-scrolling:touch;box-shadow:0 2px 10px rgba(0,0,0,.18);scrollbar-width:none;}
  .sidebar::-webkit-scrollbar{display:none;}
  .nav-item{flex:0 0 auto!important;width:auto!important;min-width:108px;min-height:44px;padding:9px 12px!important;border:0!important;border-bottom:3px solid transparent!important;border-radius:7px;text-align:center!important;justify-content:center;white-space:nowrap;font-size:12px!important;}
  .nav-item.active{border-bottom-color:var(--gold)!important;background:rgba(193,146,47,.16);}
  .main{width:100%;min-width:0;}
  .topbar{position:sticky;top:60px;z-index:15;padding:11px 12px!important;gap:8px;box-shadow:0 1px 6px rgba(0,0,0,.08);}
  .topbar h2{font-size:17px!important;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .actions{gap:6px;}
  .topbar .actions .refresh-btn{min-height:40px;padding:7px 9px;font-size:11px;}
  .content{padding:12px 10px 80px!important;max-width:none!important;}
  .card{padding:15px!important;margin-bottom:13px;border-radius:9px;overflow-x:auto;}
  .card h3{font-size:15px;}
  .grid-3{grid-template-columns:1fr!important;gap:10px;}
  .stat{padding:13px;}
  .stat .n{font-size:24px;}
  .tabs{overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;min-height:44px;padding:10px 13px!important;}
  .row,.pill-input{flex-direction:column;align-items:stretch!important;}
  .row>*{width:100%;}
  table{min-width:620px;font-size:12px;}
  .ledger{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .modal-bg{padding:10px!important;align-items:flex-end;}
  .modal{max-height:92dvh;border-radius:12px 12px 0 0;padding:18px!important;}
  .toast{left:10px;right:10px;bottom:12px;justify-content:center;text-align:center;}
  .profile-head{align-items:flex-start;}
}
@media (min-width:601px) and (max-width:820px){
  .content{padding:18px 16px 55px;}
  .card{padding:18px;}
}
'''
          if "/* ---- enhanced mobile experience ---- */" not in s:
              s = s.replace("</style>", mobile_css + "\n</style>", 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?![^>]*src=)[^>]*>([\s\S]*?)</script>", s, re.I)
          Path("/tmp/main.js").write_text("\n".join(blocks), encoding="utf-8")
          print("Inline script blocks:", len(blocks))
          PY
          node --check /tmp/main.js

      - name: Commit mobile fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-dlbs-mobile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-dlbs-mobile-fix.yml
          git diff --cached --quiet || git commit -m "Fix student login validation and improve mobile layout"
          git push origin main
