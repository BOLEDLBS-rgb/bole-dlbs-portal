/* ============================= INIT ============================= */
async function init(){
  // Check for an existing Supabase Auth session first. Do not attempt to write
  // protected school data while the browser is anonymous.
  if(supabaseClient){
    try{
      const {data,error}=await supabaseClient.auth.getSession();
      if(!error) authSession=data?.session||null;
      supabaseClient.auth.onAuthStateChange((_event,session)=>{
        authSession=session||null;
        if(authSession) loadAll().then(()=>{ refreshStoredAges(); render(); });
      });
    }catch(e){ authSession=null; console.warn("Supabase Auth session check failed",e); }
  }

  // Keep the landing page as the startup screen.
  // An existing Supabase session must not automatically open the Admin portal.
  // The user should deliberately choose a role and sign in.
  view="landing";
  session=null;
  subview="";

  // Load the current portal view without attempting an anonymous remote write.
  // Once an authenticated Supabase session exists, loadAll() can use the online data.
  await loadAll();
  refreshStoredAges();
  render();
  setInterval(async ()=>{
    const activeForm=document.querySelector('#modal-root form, #modal-root input:focus, #modal-root textarea:focus, #modal-root select:focus');
    if(activeForm || uiState.showAddStudent || uiState.showAddTeacher || uiState.editingStudent || uiState.editingTeacher || uiState.editingReport || uiState.showManualPayment) return;
    if(!authSession) return;
    await loadAll(); refreshStoredAges(); render();
  }, 45000);
}
init();

/* re-render modals whenever main render happens, so modal state persists across full renders */
const _origRender = render;
render = function(){
  _origRender();
  if(uiState.showAddStudent || uiState.showAddTeacher || uiState.showManualPayment || uiState.editingReport || uiState.editingStudent || uiState.editingTeacher){
    renderModals();
  } else {
    const holder = document.getElementById("modal-root");
    if(holder) holder.innerHTML = "";
  }
};

/* ===================== GRADUATE PHOTO STORAGE ===================== */
async function uploadGraduatePhoto(file, studentId, academicYearValue){
  if(!file) return {photoUrl:"",photoPath:""};
  if(!supabaseClient || !authSession) throw new Error("You must be signed in before uploading a graduate photo.");
  const safeYear=String(academicYearValue||academicYear()).replace(/[^0-9A-Za-z_-]+/g,"-");
  const safeId=String(studentId||uid("grad")).replace(/[^0-9A-Za-z_-]+/g,"-");
  const path=`${safeYear}/${safeId}.jpg`;
  const blob=await resizeImageToBlob(file,900,0.82);
  const {error}=await supabaseClient.storage.from(GRADUATE_PHOTO_BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:true,cacheControl:"31536000"});
  if(error) throw new Error(`Graduate photo upload failed: ${error.message}. Make sure the '${GRADUATE_PHOTO_BUCKET}' storage bucket is installed.`);
  const {data}=supabaseClient.storage.from(GRADUATE_PHOTO_BUCKET).getPublicUrl(path);
  return {photoUrl:data?.publicUrl||"",photoPath:path};
}
function resizeImageToBlob(file,maxSize=900,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image(); img.onerror=reject;
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>b?resolve(b):reject(new Error("Could not prepare the photo.")),"image/jpeg",quality);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===================== DLBS ACADEMIC WORKFLOW UPGRADE =====================
   Keeps the existing school_state storage model and student IDs.
   Adds:
   - Basic 9 Form Master-only graduation workflow
   - Academic-year grouped Graduate Students archive
   - Manual historical Basic 9 graduate entry
   - Form Master-only promotion selection for Basic 7/8
   - Automatic class result calculations from DB.marks + DB.attendance
   - Admin MARKS & RESULTS workspace + class PDF
========================================================================= */

(function(){
  const FORM_MASTER_ROLE = "FORM MASTER";
  const RESULT_SUBJECTS = (typeof BASIC_7_9_SUBJECTS!=="undefined" ? BASIC_7_9_SUBJECTS : [])
    .filter(s => s && s !== FORM_MASTER_ROLE);

  function isFormMasterFor(cls){
    return session?.role==="teacher" &&
      Array.isArray(session.classes) && session.classes.includes(cls) &&
      String(session.activeSubject||"").trim().toUpperCase()===FORM_MASTER_ROLE;
  }

  function studentAttendanceSummary(cls,sid){
    const byDate = DB.attendance?.[cls] || {};
    let present=0, absent=0, marked=0;
    Object.values(byDate).forEach(rec=>{
      const v=rec?.[sid];
      if(v==="present"){present++;marked++;}
      else if(v==="absent"){absent++;marked++;}
    });
    return {present,absent,marked,totalDays:Object.keys(byDate).length};
  }

  function getClassResultRows(cls,term){
    const list=studentsInClass(cls);
    const marks=(DB.marks?.[cls]?.[term])||{};
    const subjectSet=new Set();
    // The class result is driven by subjects actually assigned to teachers for this class.
    // Existing saved marks are also retained so historical data is never hidden.
    (DB.teachers||[]).forEach(t=>{
      if((t.classes||[]).includes(cls) && Array.isArray(t.subjects?.[cls])){
        t.subjects[cls].forEach(sub=>{ if(sub && String(sub).toUpperCase()!==FORM_MASTER_ROLE) subjectSet.add(sub); });
      }
    });
    if(subjectSet.size===0){
      Object.keys(marks).forEach(sub=>{ if(String(sub).toUpperCase()!==FORM_MASTER_ROLE) subjectSet.add(sub); });
    }
    let subjects=Array.from(subjectSet);
    const rows=list.map(st=>{
      const subjectResults=subjects.map(sub=>{
        const m=marks?.[sub]?.[st.id];
        return m && Number.isFinite(Number(m.score)) ? {name:sub,score:Number(m.score),grade:m.grade||gradeFromScoreSafe(m.score),remark:m.remark||""} : null;
      }).filter(Boolean);
      const scores=subjectResults.map(x=>x.score);
      const total=scores.reduce((a,b)=>a+b,0);
      const average=scores.length ? total/scores.length : null;
      const attendance=studentAttendanceSummary(cls,st.id);
      return {student:st,subjects:subjectResults,total,average,subjectCount:scores.length,attendance};
    });
    const ranked=rows.filter(r=>r.average!==null && subjects.length>0 && r.subjectCount===subjects.length).slice().sort((a,b)=>{
      if(b.total!==a.total) return b.total-a.total;
      return (b.average||0)-(a.average||0);
    });
    let lastKey=null,lastPos=0;
    ranked.forEach((r,i)=>{
      const key=`${r.total}|${(r.average||0).toFixed(4)}`;
      if(key!==lastKey){lastPos=i+1;lastKey=key;}
      r.position=lastPos;
    });
    rows.forEach(r=>{
      if(r.average===null || r.subjectCount!==subjects.length) r.position=null;
    });
    return {rows,subjects};
  }

  function requiredSubjectsForClass(cls){
    const set=new Set();
    (DB.teachers||[]).forEach(t=>{
      if((t.classes||[]).includes(cls) && Array.isArray(t.subjects?.[cls])){
        t.subjects[cls].forEach(sub=>{ if(sub && String(sub).toUpperCase()!==FORM_MASTER_ROLE) set.add(sub); });
      }
    });
    if(set.size===0){
      const termMarks=DB.marks?.[cls]?.["Term 3"]||{};
      Object.keys(termMarks).forEach(sub=>{ if(String(sub).toUpperCase()!==FORM_MASTER_ROLE) set.add(sub); });
    }
    return Array.from(set);
  }
  function term3PromotionReadiness(cls){
    const required=requiredSubjectsForClass(cls);
    const marks=DB.marks?.[cls]?.["Term 3"]||{};
    const missing=required.filter(sub=>!marks[sub] || Object.keys(marks[sub]||{}).length===0);
    return {required,missing,ready:required.length>0 && missing.length===0};
  }
  function promotionReview(cls){
    const term="Term 3";
    const {rows}=getClassResultRows(cls,term);
    const readiness=term3PromotionReadiness(cls);
    return rows.map(r=>{
      const complete=readiness.required.length>0 && readiness.required.every(sub=>r.subjects.some(x=>x.name===sub));
      const noFail=complete && readiness.required.every(sub=>Number(r.subjects.find(x=>x.name===sub)?.score)>=50);
      return {...r,recommended:readiness.ready && complete && noFail};
    });
  }

  function attendanceLabel(a){
    return `Present ${a.present} · Absent ${a.absent}`;
  }

  function renderGraduateStudents(){
    const years=Array.from(new Set((DB.graduatedStudents||[]).map(s=>s.academicYear||"Unknown").filter(Boolean)))
      .sort((a,b)=>String(b).localeCompare(String(a)));
    const selectedYear=uiState.graduateYear||"ALL";
    const rows=(DB.graduatedStudents||[])
      .filter(s=>selectedYear==="ALL" || (s.academicYear||"Unknown")===selectedYear)
      .slice().sort((a,b)=>String(b.graduatedDate||"").localeCompare(String(a.graduatedDate||"")));
    const canGraduate=isFormMasterFor("Basic 9");
    const yearOptions=years.map(y=>`<option value="${esc(y)}" ${selectedYear===y?"selected":""}>${esc(y)}</option>`).join("");
    const groups={};
    rows.forEach(s=>(groups[s.academicYear||"Unknown"] ||= []).push(s));
    const cards=Object.entries(groups).map(([year,list])=>`
      <div class="card">
        <h3>${esc(year)}</h3>
        <p class="card-sub">${list.length} graduate${list.length===1?"":"s"} from Basic 9</p>
        <div class="resource-grid">
          ${list.map(s=>`<div class="resource-card" style="text-align:center;position:relative">
            <div style="width:120px;height:120px;margin:0 auto 10px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f4f4f4">
              ${(s.photoUrl||s.photoData)?`<img src="${esc(s.photoUrl||s.photoData)}" style="width:100%;height:100%;object-fit:cover" alt="${esc(s.name)}">`:`<div style="padding-top:46px;color:#777">No photo</div>`}
            </div>
            <h4>${esc(s.name)}</h4>
            <p>${esc(s.formerClass||"Basic 9")} · ${esc(s.gender||"")}</p>
            <p class="meta">Graduated ${esc(s.graduatedDate||"—")}</p>
          </div>`).join("")}
        </div>
      </div>`).join("");
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
        <div><h3>GRADUATE STUDENTS</h3><p class="card-sub">Basic 9 graduates, grouped by academic year. The same student ID is retained in the graduate archive when graduation is completed.</p></div>
        <div class="row">
          <select id="graduate-year-filter"><option value="ALL" ${selectedYear==="ALL"?"selected":""}>All academic years</option>${yearOptions}</select>
          ${canGraduate?`<button class="btn btn-gold btn-sm" id="open-graduate-current">Graduate Basic 9 students</button><button class="btn btn-outline btn-sm" id="open-manual-graduate">Add past Basic 9 student</button>`:""}
        </div>
      </div>
      ${!canGraduate && session?.role==="teacher"?`<div class="help-note">Graduation and historical graduate entry are restricted to the teacher account logged in as <b>FORM MASTER</b> for <b>Basic 9</b>.</div>`:""}
    </div>${cards || `<div class="empty"><b>No graduate records</b>${selectedYear==="ALL"?"No Basic 9 graduates have been archived yet.":"No graduates were found for "+esc(selectedYear)+"."}</div>`}`;
  }

  function openGraduationSelector(){
    if(!isFormMasterFor("Basic 9")){showToast("Only the Basic 9 FORM MASTER can graduate students.");return;}
    const list=studentsInClass("Basic 9");
    if(!list.length){showToast("There are no active Basic 9 students to graduate.");return;}

    document.getElementById("confirm-graduation").onclick=async()=>{

      close(); showToast(`${graduates.length} Basic 9 student${graduates.length===1?"":"s"} graduated.`); render();

      if(!ids.length){showToast("Select at least one student.");return;}
      if(!next){showToast("There is no next class for this class.");return;}
      const readiness=term3PromotionReadiness(cls);
      if(!readiness.ready){showToast(`Promotion is locked until all Term 3 subjects have marks: ${readiness.missing.join(", ")||"required subjects"}.`);return;}
      const reviewMap=new Map(promotionReview(cls).map(r=>[r.student.id,r]));
      const selected=new Set(ids);
      const notQualified=ids.filter(id=>!reviewMap.get(id)?.recommended);
      if(notQualified.length){showToast("Only students marked Recommended by the Term 3 review can be transferred.");return;}
      DB.students=DB.students.map(s=>selected.has(s.id)&&s.class===cls&&s.status!=="left"
        ? {...s,class:next,previousClass:cls,lastPromotedAcademicYear:academicYear(),promotionStatus:"promoted"}
        : s);
      // Preserve all marks/attendance because those records are keyed by the historical class.
      await saveKey("students",DB.students);
      wrap.remove();
      showToast(`${ids.length} student${ids.length===1?"":"s"} transferred to ${next}.`); render();
    };
  }

      ${rows.slice().sort((a,b)=>(a.position||999)-(b.position||999)||a.student.name.localeCompare(b.student.name)).map(r=>`<tr><td><b>${r.position?`${r.position}${ordinalSuffix(r.position)}`:"—"}</b></td><td>${esc(r.student.name)}</td><td>${r.average===null?"—":r.total.toFixed(2)}</td><td>${r.average===null?"—":r.average.toFixed(2)}</td>${subjects.map(sub=>{const m=r.subjects.find(x=>x.name===sub);return `<td>${m?`${m.score} (${esc(m.grade)})`:"—"}</td>`}).join("")}<td>${attendanceLabel(r.attendance)}</td></tr>`).join("")}

  function ordinalSuffix(n){
    const v=n%100;
    if(v>=11&&v<=13)return "th";

  function generateClassResultsPdf(cls,term){
    const {rows,subjects}=getClassResultRows(cls,term);

    doc.setFontSize(16);doc.text(SCHOOL_NAME,14,18);
    doc.setFontSize(12);doc.text(`${cls} — ${term} Results (${academicYear()})`,14,27);
    let y=37;
    doc.setFontSize(8);
    const headers=["Pos","Student","Total","Avg","Present","Absent",...subjects.map(s=>s.slice(0,10))];
    const widths=[12,42,16,16,16,16,...subjects.map(()=>18)];
    let x=14;
    headers.forEach((h,i)=>{doc.text(h,x,y);x+=widths[i]||18;});
    y+=6;doc.line(14,y-3,198,y-3);
    rows.slice().sort((a,b)=>(a.position||999)-(b.position||999)||a.student.name.localeCompare(b.student.name)).forEach(r=>{
      if(y>280){doc.addPage();y=18;doc.setFontSize(8);let xx=14;headers.forEach((h,i)=>{doc.text(h,xx,y);xx+=widths[i]||18;});y+=6;}
      let xx=14;
      const vals=[r.position?`${r.position}${ordinalSuffix(r.position)}`:"-",String(r.student.name).slice(0,25),r.average===null?"-":r.total.toFixed(1),r.average===null?"-":r.average.toFixed(1),r.attendance.present,r.attendance.absent,...subjects.map(s=>{const m=r.subjects.find(x=>x.name===s);return m?String(m.score):"-";})];
      vals.forEach((v,i)=>{doc.text(String(v),xx,y);xx+=widths[i]||18;});
      y+=6;
    });

      const input=document.getElementById("detail-stu-photo");
      const preview=document.getElementById("student-photo-preview");
      if(input&&preview) input.onchange=()=>{const f=input.files?.[0];if(f){const r=new FileReader();r.onload=()=>preview.src=r.result;r.readAsDataURL(f);}};
    }
    if(tf){
      const input=document.getElementById("detail-t-photo");
      const preview=document.getElementById("teacher-photo-preview");
      if(input&&preview) input.onchange=()=>{const f=input.files?.[0];if(f){const r=new FileReader();r.onload=()=>preview.src=r.result;r.readAsDataURL(f);}};
    }
  };

  // Final event layer for settings, payment lock, photo persistence, and profile refresh.
  const _enhAttach=attachHandlers;
  attachHandlers=function(){
    _enhAttach();

    const selfProfileInput=document.getElementById("self-profile-photo");
    if(selfProfileInput) selfProfileInput.onchange=async()=>{
      const f=selfProfileInput.files?.[0];
      if(!f) return;
      if(!f.type.startsWith("image/")){showToast("Please choose an image file.");return;}
      try{
        selfProfileInput.disabled=true;
        const data=await fileToResizedDataUrl(f,700,0.76);
        const payload={role:session?.role,recordId:session?.role==="student"?session.student?.id:session?.teacherId,photoData:data};
        if(session?.role==="student") payload.password=document.getElementById("sp")?.value||session.student?.password||"";
        const {data:photoResult,error:photoError}=await supabaseClient.functions.invoke("update-profile-photo",{body:payload});
        if(photoError||!photoResult?.success) throw new Error(photoResult?.error||photoError?.message||"The profile picture could not be saved.");
        if(session?.role==="student"){
          const id=session.student?.id;
          DB.students=DB.students.map(st=>st.id===id?{...st,photoData:data}:st);
          session.student=DB.students.find(st=>st.id===id)||session.student;
          session.photoData=data;
        }else if(session?.role==="teacher"){
          const id=session.teacherId;
          DB.teachers=DB.teachers.map(t=>t.id===id?{...t,photoData:data}:t);
          session.photoData=data;
        }
        showToast("Your profile picture has been saved.");
        render();
      }catch(err){console.error(err);showToast("The profile picture could not be saved.");}
      finally{selfProfileInput.disabled=false;}
    };

    const bgInput=document.getElementById("portal-bg-file");
    const bgPreview=document.getElementById("portal-bg-preview");
    if(bgInput&&bgPreview) bgInput.onchange=()=>{const f=bgInput.files?.[0];if(f){const r=new FileReader();r.onload=()=>bgPreview.src=r.result;r.readAsDataURL(f);}};

    const saveBg=document.getElementById("save-portal-bg");
    if(saveBg) saveBg.onclick=async()=>{
      const f=bgInput?.files?.[0];
      if(!f){showToast("Choose a background picture first.");return;}
      try{
        saveBg.disabled=true; saveBg.textContent="Saving...";
        const data=await fileToResizedDataUrl(f,1600,0.74);
        DB.portalSettings={...portalSettings(),backgroundData:data};
        await saveKey("portalSettings",DB.portalSettings);
        applyPortalBackground();
        showToast("Portal background picture saved for Admin, Teacher and Student portals.");
        render();
      }catch(err){console.error(err);showToast("The background picture could not be saved.");saveBg.disabled=false;saveBg.textContent="Save background picture";}
    };

    const removeBg=document.getElementById("remove-portal-bg");
    if(removeBg) removeBg.onclick=async()=>{
      DB.portalSettings={...portalSettings(),backgroundData:""};
      await saveKey("portalSettings",DB.portalSettings);
      applyPortalBackground();
      showToast("The default portal background has been restored.");
      render();
    };

    document.querySelectorAll("#toggle-fee-payments").forEach(btn=>btn.onclick=async()=>{
      const fromOpen=paymentOpen();
      const open=!fromOpen;
      btn.disabled=true;
      try{
        DB.portalSettings={...portalSettings(),paymentsOpen:open};
        await saveKey("portalSettings",DB.portalSettings);
        await recordPaymentActivity(open?"Opened online fee payments":"Locked online fee payments",fromOpen,open);
        showToast(open?"Online fee payments are now OPEN.":"Online fee payments are now LOCKED.");
        render();
      }catch(err){
        console.error("Payment activity log failed",err);
        showToast("The payment status changed, but the activity log could not be saved. Please refresh and try again.");
        render();
      }
    });

    const payBtn=document.getElementById("paystack-pay-btn");
    if(payBtn){
      if(!paymentOpen()){
        payBtn.disabled=true;
        payBtn.textContent="ONLINE PAYMENTS LOCKED";
        payBtn.title="Online fee payments are temporarily locked by the school administrator.";
      }
    }

    // Keep profile photo changes immediately visible after editing an account.
    if(session?.role==="student") session.photoData=session.student?.photoData||"";
    if(session?.role==="teacher") session.photoData=DB.teachers.find(t=>t.id===session.teacherId)?.photoData||session.photoData||"";
    applyPortalBackground();
  };

  // The final modal submission layer must include local photo files while preserving all old fields.
  const _enhModalAttach=attachModalHandlers;
  attachModalHandlers=function(){
    _enhModalAttach();
    const sf=document.getElementById("student-details-form");
    if(sf){
      const original=sf.onsubmit;
      sf.onsubmit=async e=>{
        // Let the already-installed handler do all existing validation/storage, but inject photoData first.
        const file=document.getElementById("detail-stu-photo")?.files?.[0];
        if(file){try{uiState.studentDraft=uiState.studentDraft||{};uiState.studentDraft.photoData=await fileToResizedDataUrl(file,700,0.76);}catch(err){showToast("The student picture could not be prepared.");return;}}
        else if(uiState.editingStudent){const old=getStudent(uiState.editingStudent);uiState.studentDraft=uiState.studentDraft||{};uiState.studentDraft.photoData=old?.photoData||"";}
        return original?original(e):undefined;
      };
    }
    const tf=document.getElementById("teacher-details-form");
    if(tf){
      const original=tf.onsubmit;
      tf.onsubmit=async e=>{
        const file=document.getElementById("detail-t-photo")?.files?.[0];
        if(file){try{uiState.teacherDraft=uiState.teacherDraft||{};uiState.teacherDraft.photoData=await fileToResizedDataUrl(file,700,0.76);}catch(err){showToast("The teacher picture could not be prepared.");return;}}
        else if(uiState.editingTeacher){const old=DB.teachers.find(t=>t.id===uiState.editingTeacher);uiState.teacherDraft=uiState.teacherDraft||{};uiState.teacherDraft.photoData=old?.photoData||"";}
        return original?original(e):undefined;
      };
    }
  };

  // Read the shared settings directly on startup as a fallback for older cached DB objects.
  async function loadPortalSettings(){
    try{
      if(supabaseClient){
        const {data,error}=await supabaseClient.from("school_state").select("value").eq("key","portalSettings").maybeSingle();
        if(!error&&data?.value){DB.portalSettings={...DEFAULT_PORTAL_SETTINGS,...data.value};
          const {data:activityData}=await supabaseClient.from("school_state").select("value").eq("key","adminActivityLog").maybeSingle();
          if(activityData?.value) DB.adminActivityLog=Array.isArray(activityData.value)?activityData.value:[];
          applyPortalBackground();render();return;}
      }
      try{const local=localStorage.getItem("dlbs:portalSettings");if(local){DB.portalSettings={...DEFAULT_PORTAL_SETTINGS,...JSON.parse(local)};applyPortalBackground();}
        const alocal=localStorage.getItem("dlbs:adminActivityLog"); if(alocal) DB.adminActivityLog=JSON.parse(alocal);}catch(e){}
    }catch(e){console.warn("Portal settings load failed",e);}
  }
  loadPortalSettings();
  setTimeout(()=>{applyPortalBackground();if(typeof render==="function")render();},100);
})();

</script>
</body>
</html>
