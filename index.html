<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deeper Life Basic School — Bole</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1B2A4A;
  --ink-2:#233457;
  --ink-soft:#38486e;
  --paper:#F4F1E8;
  --paper-2:#FFFFFF;
  --line:#D9D2BF;
  --line-strong:#B9AF95;
  --gold:#C1922F;
  --gold-soft:#EADFB9;
  --green:#3B7A54;
  --green-soft:#E1EEE3;
  --rust:#AE3B2C;
  --rust-soft:#F3E1DC;
  --text:#221F1A;
  --text-soft:#635C4C;
  --radius:5px;
  --shadow: 0 1px 2px rgba(27,42,74,0.06), 0 6px 20px rgba(27,42,74,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}
::selection{background:var(--gold-soft);}

/* ---- landing ---- */
.landing{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  background:
    radial-gradient(1200px 600px at 50% -10%, #223258 0%, var(--ink) 55%, #14203C 100%);
  color:#EFE9D8;
  position:relative;
  overflow:hidden;
}
.landing::before{
  content:"";
  position:absolute; inset:0;
  background-image: repeating-linear-gradient(0deg, rgba(238,231,208,0.035) 0px, rgba(238,231,208,0.035) 1px, transparent 1px, transparent 34px);
  pointer-events:none;
}
.crest{
  width:76px;height:76px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:26px;
  color:var(--gold);
  margin-bottom:18px;
  background:radial-gradient(circle at 30% 30%, #26365C, #1B2A4A);
  box-shadow: 0 0 0 6px rgba(193,146,47,0.08);
}
.landing h1{
  font-size:clamp(28px,4.5vw,44px);
  margin:0 0 6px;
  font-weight:600;
  letter-spacing:0.2px;
  text-align:center;
}
.landing .sub{
  color:#C9BFA0;
  font-size:15px;
  margin-bottom:38px;
  text-align:center;
  letter-spacing:0.4px;
  text-transform:uppercase;
  font-size:12px;
}
.role-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
  max-width:820px;
  width:100%;
  position:relative;
  z-index:1;
}
.role-card{
  background:rgba(244,241,232,0.04);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  border:1px solid rgba(193,146,47,0.35);
  border-radius:var(--radius);
  padding:22px 18px;
  text-align:left;
  color:#EFE9D8;
  transition:all .15s ease;
  backdrop-filter: blur(2px);
}
.role-card:hover{
  background:rgba(193,146,47,0.1);
  border-color:var(--gold);
  transform:translateY(-2px);
}
.role-card .num{
  font-family:'IBM Plex Mono',monospace;
  color:var(--gold);
  font-size:12px;
  display:block;
  margin-bottom:10px;
}
.role-card h3{margin:0 0 6px;font-size:19px;font-weight:600;}
.role-card p{margin:0;font-size:13px;color:#B9AF95;line-height:1.5;}

/* ---- login card ---- */
.center-wrap{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-color:#1b1b1b;
  background-image:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),var(--dlbs-portal-bg),var(--dlbs-login-bg);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  padding:20px;
}
.login-card{
  background:var(--paper-2);
  border-radius:8px;
  padding:36px 34px;
  width:100%;max-width:400px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.login-logo{display:block;width:78px;height:78px;object-fit:contain;border-radius:50%;margin:0 auto 14px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);}
.login-card .eyebrow{
  font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px;
}
.login-card h2{margin:0 0 22px;font-size:24px;color:var(--ink);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-soft);margin-bottom:5px;font-weight:500;}
.field input, .field select{
  width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:4px;
  font-size:14.5px;background:#FDFCF9;color:var(--text);
}
.field input:focus, .field select:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink);}
.btn{
  border:none;border-radius:4px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn-primary{background:var(--ink);color:#F4F1E8;width:100%;padding:12px;}
.btn-primary:hover{background:var(--ink-2);}
.btn-gold{background:var(--gold);color:#241B04;}
.btn-gold:hover{background:#AD8329;}
.btn-outline{background:transparent;border:1px solid var(--line-strong);color:var(--text);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--rust);color:#fff;}
.btn-danger:hover{background:#93301F;}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.password-cell{display:flex;align-items:center;gap:6px;min-width:145px;}
.password-mask{font-family:'IBM Plex Mono',monospace;letter-spacing:1px;min-width:82px;}
.password-eye{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:4px;width:32px;height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.password-eye:hover{background:var(--gold-soft);border-color:var(--gold);}
.password-eye svg{width:16px;height:16px;pointer-events:none;}
.lockout-box{background:#fff3cd;color:#7a5c15;border:1px solid #e5c96b;padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:14px;}
.error-msg{background:var(--rust-soft);color:var(--rust);padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:14px;}
.back-link{background:none;border:none;color:#C9BFA0;font-size:13px;margin-top:18px;text-decoration:underline;}
.help-note{font-size:12px;color:var(--text-soft);margin-top:14px;line-height:1.5;}

/* ---- app shell ---- */

:root{--dlbs-portal-bg:none;}
.shell{
  display:flex;min-height:100vh;
  background-image:linear-gradient(rgba(12,24,48,.30),rgba(12,24,48,.30)),var(--dlbs-portal-bg);
  background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
}
.shell .main{background:rgba(244,241,232,.84);backdrop-filter:blur(1px);}
.shell .topbar{background:rgba(255,255,255,.94);backdrop-filter:blur(4px);}
.profile-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;display:block;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.profile-avatar-lg{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff;display:block;box-shadow:0 4px 16px rgba(0,0,0,.16);}
.profile-head{display:flex;align-items:center;gap:12px;}
.photo-preview{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid var(--line-strong);background:#f4f4f4;display:block;}
.settings-preview{width:100%;height:190px;border-radius:7px;object-fit:cover;border:1px solid var(--line);background:#f1f1f1;display:block;}
.payment-lock-open{background:var(--green-soft);color:var(--green);border:1px solid #a9d1b3;padding:12px 14px;border-radius:6px;}
.payment-lock-closed{background:var(--rust-soft);color:var(--rust);border:1px solid #dfb0a7;padding:12px 14px;border-radius:6px;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#EFE9D8;
  display:flex;flex-direction:column;padding:20px 0;
  position:sticky;top:0;height:100vh;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid rgba(238,231,208,0.12);margin-bottom:14px;}
.sidebar .brand .mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--gold);font-size:13px;flex-shrink:0;}
.sidebar .brand div b{display:block;font-size:13px;line-height:1.25;font-family:'Fraunces',serif;}
.sidebar .brand div span{font-size:10px;color:#B9AF95;text-transform:uppercase;letter-spacing:0.5px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13.5px;color:#D7CFB6;
  border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(238,231,208,0.05);color:#fff;}
.nav-item.active{background:rgba(193,146,47,0.12);border-left-color:var(--gold);color:#fff;font-weight:600;}
.sidebar-foot{margin-top:auto;padding:14px 20px 4px;border-top:1px solid rgba(238,231,208,0.12);}
.who{font-size:12px;color:#B9AF95;margin-bottom:8px;}
.who b{color:#EFE9D8;display:block;font-size:13px;}
.main{flex:1;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding:16px 28px;background:var(--paper-2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.topbar h2{margin:0;font-size:20px;color:var(--ink);}
.topbar .actions{display:flex;gap:10px;align-items:center;}
.refresh-btn{
  display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line-strong);
  padding:8px 13px;border-radius:4px;font-size:12.5px;font-weight:600;color:var(--ink);
}
.refresh-btn:hover{background:var(--gold-soft);border-color:var(--gold);}
.refresh-btn.spin svg{animation:spin 0.7s linear;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.content{padding:26px 28px 60px;max-width:1180px;}

/* ---- cards / tables ---- */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow);overflow-x:auto;}
.card h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
.card .card-sub{font-size:12.5px;color:var(--text-soft);margin:0 0 16px;}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
.stat .n{font-family:'Fraunces',serif;font-size:28px;color:var(--ink);font-weight:600;}
.stat .l{font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-soft);margin-top:2px;}
table{width:100%;min-width:460px;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-soft);
  border-bottom:1.5px solid var(--line-strong);padding:9px 10px;font-weight:600;
}
tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:rgba(193,146,47,0.04);}
.ledger{border:1px solid var(--line-strong);border-radius:4px;overflow-x:auto;}
.ledger table{background-image: repeating-linear-gradient(180deg, transparent, transparent 40px, rgba(0,0,0,0.02) 40px, rgba(0,0,0,0.02) 41px);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge-present{background:var(--green-soft);color:var(--green);}
.badge-absent{background:var(--rust-soft);color:var(--rust);}
.badge-paid{background:var(--green-soft);color:var(--green);}
.badge-partial{background:var(--gold-soft);color:#7A5C15;}
.badge-owing{background:var(--rust-soft);color:var(--rust);}
.badge-pending{background:#E4E9F2;color:var(--ink-2);}
.badge-approved{background:var(--green-soft);color:var(--green);}
.stamp{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:2px solid var(--green);color:var(--green);border-radius:50%;
  width:64px;height:64px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  transform:rotate(-8deg);text-align:center;line-height:1.2;
}
.stamp.pending{border-color:var(--text-soft);color:var(--text-soft);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 16px;font-size:13.5px;background:none;border:none;color:var(--text-soft);border-bottom:2px solid transparent;font-weight:500;}
.tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}
.tab:hover{color:var(--ink);}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{
  padding:9px 10px;border:1px solid var(--line-strong);border-radius:4px;font-size:13.5px;background:#FDFCF9;color:var(--text);
}
textarea{width:100%;resize:vertical;font-family:'Inter',sans-serif;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.empty{padding:34px 20px;text-align:center;color:var(--text-soft);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:6px;}
.empty b{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;margin-bottom:4px;}
.pill-input{display:flex;gap:8px;flex-wrap:wrap;}
.news-item{border-left:3px solid var(--gold);background:var(--paper);padding:14px 16px;border-radius:0 4px 4px 0;margin-bottom:12px;}
.news-item h4{margin:0 0 4px;font-size:14.5px;color:var(--ink);font-family:'Fraunces',serif;}
.news-item .date{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
.news-item p{margin:0;font-size:13.5px;line-height:1.5;color:var(--text);}
.countdown{font-family:'IBM Plex Mono',monospace;background:var(--ink);color:var(--gold);padding:8px 12px;border-radius:4px;font-size:13px;display:inline-block;margin-top:8px;}
.modal-bg{position:fixed;inset:0;background:rgba(27,42,74,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:8px;padding:26px;max-width:480px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal h3{margin:0 0 16px;color:var(--ink);}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--text-soft);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#F4F1E8;padding:13px 18px;border-radius:6px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;display:flex;align-items:center;gap:10px;border-left:3px solid var(--gold);}
.subject-row{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center;}
@media (max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:12px 0;}
  .sidebar .brand{display:none;}
  .sidebar-foot{display:none;}
  .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .nav-item.active{border-left:none;border-bottom-color:var(--gold);}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
  .subject-row{grid-template-columns:1fr;}
}
.school-logo-inline{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;}
.crest img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;}
.sidebar .brand .mark{overflow:hidden;background:#fff;padding:2px;}
.sidebar .brand .mark img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;}
.social-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px;position:relative;z-index:1;}
.social-links a{color:#EFE9D8;border:1px solid rgba(193,146,47,0.35);padding:8px 12px;border-radius:4px;text-decoration:none;font-size:12px;background:rgba(244,241,232,0.04);}
.social-links a:hover{background:rgba(193,146,47,0.1);border-color:var(--gold);}
.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.resource-card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;}
.resource-card h4{margin:0 0 6px;color:var(--ink);font-family:'Fraunces',serif;}
.resource-card p{margin:4px 0;font-size:12.5px;color:var(--text-soft);line-height:1.45;}
.resource-list{display:grid;gap:10px;margin-top:14px;}
.resource-item{border:1px solid var(--line);border-radius:5px;padding:11px;background:#fff;}
.resource-item .meta{font-size:11px;color:var(--text-soft);margin-top:4px;}
.gender-group{margin-bottom:20px;}
.gender-group h4{margin:0 0 8px;font-family:'Fraunces',serif;color:var(--ink);font-size:15px;}
.gender-group .ledger{margin-bottom:10px;}
</style>

<script>
/* ============================= SUPABASE CONFIG ============================= */
const SUPABASE_URL = "https://aqkkgpjmtecmwugjxgum.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QxT8c_EzOrXtzyJyxFJ4Qg_A60lc_5d";

const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
const GRADUATE_PHOTO_BUCKET = "graduate-photos";

function addSchoolLogoToPdf(doc){
  try{
    if(typeof SCHOOL_LOGO==="string" && SCHOOL_LOGO.startsWith("data:image/")){
      doc.addImage(SCHOOL_LOGO,"JPEG",172,7,25,25);
    }
  }catch(e){ console.warn("School logo could not be added to PDF",e); }
}

function teacherAuthEmail(username){ const normalized=String(username||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"_"); return `${normalized}@teachers.dlbs.local`; }

// Teacher-account calls return a readable server error even when the Edge Function
// responds with HTTP 4xx/5xx. This makes deployment/configuration problems visible
// to the Admin instead of showing only the generic "non-2xx" message.
async function invokeTeacherFunction(body){
  const {data,error}=await supabaseClient.functions.invoke("create-teacher",{body});
  if(error){
    let detail="";
    try{
      const response=error?.context;
      if(response && typeof response.clone==="function"){
        const copy=response.clone();
        const raw=await copy.text();
        if(raw){
          try{
            const parsed=JSON.parse(raw);
            detail=parsed?.error||parsed?.message||raw;
          }catch(_){ detail=raw; }
        }
      }
    }catch(_){ }
    const e=new Error(detail||error?.message||"Teacher account service failed.");
    e.cause=error;
    throw e;
  }
  if(!data) throw new Error("Teacher account service returned no response.");
  if(data.success===false) throw new Error(data.error||"Teacher account service rejected the request.");
  return data;
}
let realtimeChannel = null;
let authSession = null;
let remoteReady = false;
let remoteWriteBusy = false;

/* ============================= CONSTANTS ============================= */
const CLASSES = ["Nursery","KG 1","KG 2","Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6","Basic 7","Basic 8","Basic 9"];
const TEACHER_CLASS_GROUPS = ["Nursery","KG 1","KG 2","Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6","Basic 7–9"];
function expandTeacherClassGroup(v){ return v==="Basic 7–9" ? ["Basic 7","Basic 8","Basic 9"] : [v]; }
function teacherDisplayClasses(t){ return Array.isArray(t?.classes) ? t.classes : []; }
function academicYear(d=new Date()){ const y=d.getFullYear(), m=d.getMonth()+1; return m>=8 ? `${y}/${y+1}` : `${y-1}/${y}`; }
function nextClassFor(cls){ const i=CLASSES.indexOf(cls); return i>=0 && i<CLASSES.length-1 ? CLASSES[i+1] : ""; }
const BANK_ACCOUNT = "808101033677";

  const subjects=(teacher&&teacher.subjects&&Array.isArray(teacher.subjects[cls]))?teacher.subjects[cls]:[];
  return subjects.length ? `${cls} — ${subjects.join(", ")}` : cls;
}
function sessionClassLabel(cls){
  const subjects=(session&&session.subjects&&Array.isArray(session.subjects[cls]))?session.subjects[cls]:[];

}

function renderTeacherSubjects(teacher){
  const map=teacherSubjectMap(teacher);
  const parts=Object.entries(map).filter(([,list])=>list.length).map(([cls,list])=>`${cls}: ${list.join(", ")}`);
  return parts.length?parts.join("<br>"):"—";
}

const LOGIN_LOCK_SECONDS = 30;
function loginLockKey(role, identity){ return `dlbs:login-lock:${role}:${String(identity||"").trim().toLowerCase()}`; }
function getLoginLock(role, identity){
  try{
    const raw=localStorage.getItem(loginLockKey(role,identity)); if(!raw) return {failures:0,lockedUntil:0};
    const v=JSON.parse(raw)||{}; const until=Number(v.lockedUntil||0);
    if(until<=Date.now()) return {failures:Number(v.failures||0),lockedUntil:0};
    return {failures:Number(v.failures||0),lockedUntil:until};
  }catch(e){ return {failures:0,lockedUntil:0}; }
}
function recordLoginFailure(role, identity){
  let state=getLoginLock(role,identity);
  state.failures=Number(state.failures||0)+1;
  if(state.failures>=3){ state.lockedUntil=Date.now()+LOGIN_LOCK_SECONDS*1000; state.failures=0; }
  try{localStorage.setItem(loginLockKey(role,identity),JSON.stringify(state));}catch(e){}
  return state;
}
function clearLoginFailures(role, identity){ try{localStorage.removeItem(loginLockKey(role,identity));}catch(e){} }
function loginLockMessage(state){
  const seconds=Math.max(1,Math.ceil((Number(state.lockedUntil)-Date.now())/1000));
  return `Too many incorrect password attempts. Login is temporarily locked for ${seconds} second${seconds===1?"":"s"}.`;
}

}
function renderPasswordCell(value, key){

async function invokeStudentData(body){
  if(!supabaseClient) throw new Error("Student online data service is unavailable.");
  const {data,error}=await supabaseClient.functions.invoke("student-data",{body});
  if(error){
    let detail="";
    try{
      const response=error?.context;
      if(response && typeof response.clone==="function"){
        const copy=response.clone(); const raw=await copy.text();
        if(raw){ try{ const parsed=JSON.parse(raw); detail=parsed?.error||parsed?.message||raw; }catch(_){ detail=raw; } }
      }
    }catch(_){ }
    throw new Error(detail||error?.message||"Student school data could not be loaded.");
  }
  if(!data?.success) throw new Error(data?.error||"Student school data could not be loaded.");
  return data;
}

async function loadStudentDataRemote(name, cls, password){
  const data=await invokeStudentData({action:"login",name, className:cls, password});
  const state=data.state||{};
  const student=state.student||null;
  if(!student?.id) throw new Error("Student profile could not be loaded from the school database.");
  DB.students=[student];
  DB.attendance=normalizeLoadedData("attendance",state.attendance||{});
  DB.reports=normalizeLoadedData("reports",state.reports||{});
  DB.marks=normalizeLoadedData("marks",state.marks||{});
  DB.feeStructure=normalizeLoadedData("feeStructure",state.feeStructure||{});
  DB.feeRecords=normalizeLoadedData("feeRecords",state.feeRecords||{});
  DB.news=normalizeLoadedData("news",state.news||[]);
  DB.books=normalizeLoadedData("books",state.books||[]);
  DB.onlineClasses=normalizeLoadedData("onlineClasses",state.onlineClasses||[]);
  DB.portalSettings=normalizeLoadedData("portalSettings",state.portalSettings||{});
  remoteReady=true;
  return data;
}

async function saveStudentDataRemote(key,val){
  const s=session?.student;
  if(!s?.id) throw new Error("Student session is unavailable.");
  const data=await invokeStudentData({action:"save",key,value:val,name:s.name,className:s.class,password:s.password||""});
  const state=data.state||{};
  if(state.feeRecords) DB.feeRecords=normalizeLoadedData("feeRecords",state.feeRecords);
  return data;
}

async function loadTeacherDataRemote(){
  if(!supabaseClient || !authSession?.access_token) throw new Error("Teacher online session is unavailable.");
  const {data,error}=await supabaseClient.functions.invoke("teacher-data",{body:{action:"load",teacherId:session?.teacherId||undefined}});
  if(error){
    let detail="";
    try{
      const response=error?.context;
      if(response && typeof response.clone==="function"){
        const copy=response.clone(); const raw=await copy.text();
        if(raw){ try{ const parsed=JSON.parse(raw); detail=parsed?.error||parsed?.message||raw; }catch(_){ detail=raw; } }
      }
    }catch(_){ }
    throw new Error(detail||error?.message||"Teacher school data could not be loaded.");
  }
  if(!data?.success) throw new Error(data?.error||"Teacher school data could not be loaded.");
  const state=data.state||{};
  for(const k of ["students","teachers","attendance","reports","marks","graduatedStudents","news","books","onlineClasses","portalSettings"]){
    if(Object.prototype.hasOwnProperty.call(state,k)) DB[k]=normalizeLoadedData(k,state[k]);
  }
  DB.graduatedStudents=Array.isArray(DB.graduatedStudents)?DB.graduatedStudents:[];
  remoteReady=true;
  return data;
}

async function loadAll(){
  if(session?.role==="student"){
    try{
      await loadStudentDataRemote(session.student?.name||session.displayName||"",session.student?.class||"",session.student?.password||"");
      const fresh=DB.students.find(x=>x.id===session.student.id);
      if(fresh) session.student={...fresh,password:session.student.password};
      session.photoData=session.student?.photoData||"";
      return;
    }catch(e){
      console.error("Student remote data load failed",e);
      throw e;
    }
  }
  if(session?.role==="teacher" && supabaseClient && authSession){
    try{
      await loadTeacherDataRemote();
      return;
    }catch(e){
      console.error("Teacher remote data load failed",e);
      // Keep a local copy only as a temporary fallback; do not query the protected school_state table as a teacher.
      for(const k of REMOTE_KEYS){
        try{ const local=localStorage.getItem("dlbs:"+k); if(local!==null) DB[k]=normalizeLoadedData(k,JSON.parse(local)); else DB[k]=defaultValueFor(k); }catch(_){ DB[k]=defaultValueFor(k); }
      }
      throw e;
    }
  }
  const keys = REMOTE_KEYS;
  let remoteAny=false;
  if(supabaseClient){
    try{
      const {data,error}=await supabaseClient.from("school_state").select("key,value");
      if(!error && Array.isArray(data)){
        const map=new Map(data.map(r=>[r.key,r.value]));
        for(const k of keys){ if(map.has(k)) DB[k]=normalizeLoadedData(k,map.get(k)); else DB[k]=defaultValueFor(k); }
        remoteAny=data.length>0; remoteReady=true;
      }
    }catch(e){}
  }
  // Keep local data as a migration fallback when the remote table is empty/unavailable.
  for(const k of keys){
    if(remoteAny) continue;
    try{ const local=localStorage.getItem("dlbs:"+k); if(local!==null) DB[k]=normalizeLoadedData(k,JSON.parse(local)); else DB[k]=defaultValueFor(k); }catch(e){ DB[k]=defaultValueFor(k); }
  }
  if(!remoteAny && window.storage && typeof window.storage.get === "function") {
    for(const k of keys){
      try{ const res=await window.storage.get("dlbs:"+k,true); if(res?.value!=null) DB[k]=normalizeLoadedData(k,JSON.parse(res.value)); }catch(e){}
    }
  }
  DB.graduatedStudents=Array.isArray(DB.graduatedStudents)?DB.graduatedStudents:[];
  if(supabaseClient && !realtimeChannel){
    realtimeChannel=supabaseClient.channel("dlbs-school-state")
      .on("postgres_changes",{event:"*",schema:"public",table:"school_state"},payload=>{
        const k=payload.new?.key || payload.old?.key; if(!REMOTE_KEYS.includes(k)) return;
        if(payload.eventType==="DELETE") DB[k]=defaultValueFor(k); else DB[k]=normalizeLoadedData(k,payload.new.value);
        if(!remoteWriteBusy) { refreshStoredAges(); render(); }
      }).subscribe();
  }
}
async function saveKey(key,val){
  DB[key]=val;
  const payload=JSON.stringify(val);
  if(session?.role==="student" && supabaseClient){
    let saved=false;
    try{ localStorage.setItem("dlbs:"+key,payload); }catch(e){}
    remoteWriteBusy=true;
    try{ await saveStudentDataRemote(key,val); saved=true; }
    catch(e){ console.error("Student data save failed",e); }
    finally{ remoteWriteBusy=false; }
    if(!saved) showToast("Could not save to the online school database. Please try again.");
    return saved;
  }
  if(session?.role==="teacher" && supabaseClient && authSession){
    let saved=false;
    try{ localStorage.setItem("dlbs:"+key,payload); }catch(e){}
    remoteWriteBusy=true;
    try{
      const {data,error}=await supabaseClient.functions.invoke("teacher-data",{body:{action:"save",key,value:val,teacherId:session.teacherId}});
      if(!error && data?.success) saved=true;
      else if(error) console.error("Teacher data save failed",error);
      else if(data?.error) console.error("Teacher data save rejected",data.error);
    }catch(e){ console.error("Teacher data save failed",e); }
    finally{ remoteWriteBusy=false; }
    if(!saved) showToast("Could not save to the online school database. Your browser kept a local backup.");
    return saved;
  }
  let saved=false;
  // Always keep a local emergency copy, but the authoritative copy is Supabase.
  try{ localStorage.setItem("dlbs:"+key,payload); }catch(e){}
  // Never write directly to the protected school_state table before Supabase Auth.
  // RLS correctly rejects anonymous browser writes; keep a local emergency copy until
  // the user has an authenticated Supabase session.
  if(supabaseClient && authSession){
    remoteWriteBusy=true;
    try{
      const {error}=await supabaseClient.from("school_state").upsert({key,value:val,updated_at:new Date().toISOString()},{onConflict:"key"});
      if(!error) saved=true; else console.error("Supabase save failed",error);
    }catch(e){ console.error("Supabase save failed",e); }
    finally{ remoteWriteBusy=false; }
  }
  if(!saved && window.storage && typeof window.storage.set === "function") { try{ await window.storage.set("dlbs:"+key,payload,true); saved=true; }catch(e){} }
  if(!saved) showToast("Could not reach the online database. Your browser kept a local backup.");
}
async function refresh(spin){
  if(spin){
    const btn = document.getElementById("refresh-btn");
    if(btn) btn.classList.add("spin");
  }
  await loadAll();
  render();
  showToast("Up to date.");
}

/* ============================= HELPERS ============================= */
function studentsInClass(cls){ return DB.students.filter(s=>s.class===cls && s.status!=="left"); }
function getStudent(id){ return DB.students.find(s=>s.id===id); }
function feeBalance(studentId){
  const student = getStudent(studentId);
  if(!student) return {due:0,paid:0,balance:0};
  const due = DB.feeStructure[student.class] || 0;
  const recs = (DB.feeRecords[studentId]||[]).filter(r=>r.status==="confirmed");
  const paid = recs.reduce((a,r)=>a+Number(r.amount),0);
  return {due, paid, balance: Math.max(due-paid,0)};
}
function feeStatusLabel(studentId){
  const {due,paid,balance} = feeBalance(studentId);
  if(due===0) return {label:"No fee set", cls:"badge-pending"};
  if(balance<=0) return {label:"Fully paid", cls:"badge-paid"};
  if(paid>0) return {label:"Partial", cls:"badge-partial"};
  return {label:"Owing", cls:"badge-owing"};
}
function genPasscode(name){
  const first = (name.trim().split(" ")[0]||"stu").toLowerCase().replace(/[^a-z]/g,"");
  const num = Math.floor(10+Math.random()*89);
  return first + num;
}
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){
  const holder = document.getElementById("toast-holder");
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span>${msg}</span>`;
  holder.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================= ADMIN: OVERVIEW ============================= */
function adminOverview(){
  const totalStudents = DB.students.filter(s=>s.status!=="left").length;
  const totalTeachers = DB.teachers.length;
  const today = todayISO();
  let presentToday=0, markedClasses=0;
  CLASSES.forEach(c=>{
    const rec = (DB.attendance[c]||{})[today];
    if(rec){ markedClasses++; presentToday += Object.values(rec).filter(v=>v==="present").length; }
  });
  let owingCount = 0;
  DB.students.forEach(s=>{ if(s.status!=="left" && feeBalance(s.id).balance>0) owingCount++; });
  const pendingPayments = Object.values(DB.feeRecords).flat().filter(r=>r.status==="pending").length;
  return `
  <div class="grid-3" style="margin-bottom:20px;">
    <div class="stat"><div class="n">${totalStudents}</div><div class="l">Enrolled Students</div></div>
    <div class="stat"><div class="n">${totalTeachers}</div><div class="l">Teacher Accounts</div></div>
    <div class="stat"><div class="n">${presentToday}</div><div class="l">Present Today (${markedClasses}/${CLASSES.length} classes marked)</div></div>
    <div class="stat"><div class="n">${owingCount}</div><div class="l">Students Owing Fees</div></div>
    <div class="stat"><div class="n">${pendingPayments}</div><div class="l">Payments Awaiting Confirmation</div></div>
    <div class="stat"><div class="n">${DB.news.length}</div><div class="l">Announcements Posted</div></div>
  </div>
  <div class="card">
    <h3>Class roll call</h3>
    <p class="card-sub">Enrollment per class, admission office view.</p>
    <table>
      <thead><tr><th>Class</th><th>Students</th><th>Attendance marked today</th></tr></thead>
      <tbody>
        ${CLASSES.map(c=>{
          const n = studentsInClass(c).length;
          const marked = (DB.attendance[c]||{})[today] ? "Yes" : "Not yet";
          return `<tr><td>${c}</td><td>${n}</td><td>${marked==="Yes" ? '<span class="badge badge-present">Marked</span>' : '<span class="badge badge-pending">Pending</span>'}</td></tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>`;
}

  const renderTeacherTable=(title, teachers)=>`

      <div class="row" style="justify-content:space-between;margin-bottom:12px;">

      </div>
      <table>
        <thead><tr><th>Name</th><th>Date of Birth</th><th>Age</th><th>Contact</th><th>Date of Appointment</th><th>Level of Education</th><th>Username</th><th>Password</th><th>Class(es)</th><th></th></tr></thead>
        <tbody>${teachers.map(t=>`
          <tr>
            <td>${esc(t.name)}</td>
            <td>${t.dateOfBirth ? fmtDate(t.dateOfBirth) : "—"}</td>
            <td>${t.age ?? (t.dateOfBirth ? calculateAgeFromDob(t.dateOfBirth) : "—")}</td>

            <td class="mono">${esc(t.username)}</td><td>${renderPasswordCell(t.password, "teacher-"+t.id)}</td>
            <td>${(t.classes||[]).map(c=>`<div><b>${esc(c)}</b>${(t.subjects?.[c]||[]).length?` <span class="help-note">— ${esc((t.subjects[c]||[]).join(", "))}</span>`:""}</div>`).join("")}</td>
            <td class="row"><button class="btn btn-outline btn-sm" data-edit-teacher="${t.id}">Edit / Save</button><button class="btn btn-danger btn-sm" data-remove-teacher="${t.id}">Remove</button></td>

function adminFeePending(){
  const pendings = [];
  Object.entries(DB.feeRecords).forEach(([sid,recs])=>{
    recs.forEach(r=>{ if(r.status==="pending") pendings.push({...r, studentId:sid}); });
  });
  return `
  <div class="card">
    <h3>Payments awaiting confirmation</h3>
    <p class="card-sub">Submitted by students/parents via online payment. Confirm once received in the school account.</p>
    ${pendings.length===0 ? `<div class="empty"><b>Nothing pending</b>All submitted payments have been confirmed.</div>` : `
    <table>
      <thead><tr><th>Student</th><th>Class</th><th>Amount</th><th>Reference</th><th>Date</th><th></th></tr></thead>
      <tbody>
        ${pendings.map(p=>{
          const st = getStudent(p.studentId);
          return `<tr>
            <td>${st?esc(st.name):"—"}</td>
            <td>${st?st.class:"—"}</td>
            <td>GHS ${p.amount}</td>
            <td class="mono">${esc(p.reference||"—")}</td>
            <td>${fmtDate(p.date)}</td>
            <td class="row"><button class="btn btn-outline btn-sm" data-confirm-payment="${p.studentId}|${p.id}">Confirm</button><button class="btn btn-danger btn-sm" data-reject-payment="${p.studentId}|${p.id}">Reject</button></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`}
  </div>`;
}

function renderNewsItem(n, isAdmin){
  const days = n.countdownDate ? Math.ceil((new Date(n.countdownDate) - new Date())/86400000) : null;
  return `<div class="news-item">
    <div class="date">${fmtDate(n.date)}</div>
    <h4>${esc(n.title)}</h4>
    ${n.message ? `<p>${esc(n.message)}</p>` : ""}
    ${Array.isArray(n.media)&&n.media.length ? `<div class="news-media-grid">${n.media.map((m,i)=>m.type==="video" ? `<video controls preload="metadata" style="width:100%;max-height:420px;border-radius:10px;background:#000;" src="${esc(m.data)}"></video>` : `<img loading="lazy" src="${esc(m.data)}" alt="Announcement picture ${i+1}" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;display:block;">`).join("")}</div>` : (n.mediaData ? (n.mediaType==="video" ? `<video controls preload="metadata" style="width:100%;max-height:420px;border-radius:10px;background:#000;" src="${esc(n.mediaData)}"></video>` : `<img loading="lazy" src="${esc(n.mediaData)}" alt="Announcement picture" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;display:block;">`) : "")}
    ${n.countdownDate ? `<div class="countdown">${days>=0 ? days+" day(s) to "+fmtDate(n.countdownDate) : "Date passed — "+fmtDate(n.countdownDate)}</div>` : ""}
    ${isAdmin ? `<div style="margin-top:10px;"><button class="btn btn-danger btn-sm" data-delete-news="${n.id}">Delete</button></div>` : ""}
  </div>`;
}

/* ============================= REPORT EDITOR (shared teacher/admin) ============================= */
function gradeFromScore(score){
  const n=Number(score);
  if(!Number.isFinite(n)) return "";
  if(n>=80) return "A";
  if(n>=70) return "B";
  if(n>=60) return "C";
  if(n>=50) return "D";
  if(n>=40) return "E";
  return "F";
}
function teacherAssignedReportSubjects(cls){
  return (session?.role === "teacher" && session.subjects && Array.isArray(session.subjects[cls])) ? session.subjects[cls] : [];
}
function reportEditorModal(){
  if(!uiState.editingReport) return "";
  const [sid, term] = uiState.editingReport.split("|");
  const student = getStudent(sid);
  const existing = (DB.reports[sid]||{})[term];
  const assigned = teacherAssignedReportSubjects(student?.class);
  const defaultSubjects = assigned.length ? assigned.map(name=>({name,score:"",grade:"",remark:""})) : [{name:"",score:"",grade:"",remark:""}];
  const subjects = uiState.reportDraft?.subjects || existing?.subjects || defaultSubjects;
  const draft = uiState.reportDraft || existing || {subjects, conduct:"", interest:"", teacherRemark:"", headRemark:"", position:"", attendanceSummary:""};
  return `
  <div class="modal-bg" id="report-modal-bg">
    <div class="modal" style="max-width:640px;">
      <h3>Terminal Report — ${esc(student?.name||"")} <span style="font-weight:400;font-size:14px;color:var(--text-soft);">(${term}, ${student?.class})</span></h3>
      <div class="field"><label>Subjects &amp; scores</label>
        <div id="subjects-wrap">
          ${subjects.map((sub,i)=>`
          <div class="subject-row">
            ${session?.role === "teacher" && assignedSubjects.length ? `<select data-sub="${i}" data-field="name">${assignedSubjects.map(x=>`<option value="${esc(x)}" ${x===sub.name?"selected":""}>${esc(x)}</option>`).join("")}</select>` : `<input type="text" placeholder="Subject" value="${esc(sub.name)}" data-sub="${i}" data-field="name">`}
            <input type="number" min="0" max="100" placeholder="Score (0-100)" value="${esc(sub.score)}" data-sub="${i}" data-field="score">
            <input type="text" placeholder="Grade" value="${esc(sub.grade)}" data-sub="${i}" data-field="grade" readonly>
            <input type="text" placeholder="Remark" value="${esc(sub.remark)}" data-sub="${i}" data-field="remark">
            <button type="button" class="btn btn-danger btn-sm" data-remove-subject="${i}">✕</button>
          </div>`).join("")}
        </div>
        ${session?.role === "teacher" && assigned.length ? `<div class="help-note">You can enter scores only for the subject(s) assigned to you.</div>` : `<button type="button" class="btn btn-outline btn-sm" id="add-subject-btn">+ Add subject</button>`}
      </div>
      <div class="field"><label>Class position</label><input type="text" id="rep-position" value="${esc(draft.position||"")}" placeholder="e.g. 3rd out of 28"></div>
      <div class="field"><label>Attendance summary</label><input type="text" id="rep-attendance" value="${esc(draft.attendanceSummary||"")}" placeholder="e.g. Present 58 / Absent 2"></div>
      <div class="field"><label>Conduct</label><input type="text" id="rep-conduct" value="${esc(draft.conduct||"")}"></div>
      <div class="field"><label>Interest / extracurricular</label><input type="text" id="rep-interest" value="${esc(draft.interest||"")}"></div>
      <div class="field"><label>Teacher's remark</label><textarea id="rep-teacher-remark" rows="2">${esc(draft.teacherRemark||"")}</textarea></div>
      <div class="field"><label>Head teacher's remark</label><textarea id="rep-head-remark" rows="2">${esc(draft.headRemark||"")}</textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px;">
        <button class="btn btn-outline" id="cancel-report-btn">Cancel</button>
        <button class="btn btn-primary" id="save-report-btn">Save report</button>
      </div>
    </div>
  </div>`;
}

/* ============================= STUDENT/PARENT: REGISTER ============================= */
function studentRegister(){
  const s = session.student;
  const cls = s.class;
  const records = [];
  Object.entries((DB.attendance[cls]||{})).forEach(([date, rec])=>{
    if(rec[s.id]) records.push({date, status: rec[s.id]});
  });
  records.sort((a,b)=> new Date(b.date)-new Date(a.date));
  const present = records.filter(r=>r.status==="present").length;
  const absent = records.filter(r=>r.status==="absent").length;
  return `
  <div class="grid-3" style="margin-bottom:20px;">
    <div class="stat"><div class="n">${present}</div><div class="l">Days present</div></div>
    <div class="stat"><div class="n">${absent}</div><div class="l">Days absent</div></div>
    <div class="stat"><div class="n">${records.length}</div><div class="l">Total days recorded</div></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h3 style="margin:0;">Attendance register</h3>
      <button class="btn btn-gold btn-sm" id="download-register-btn">Download as PDF</button>
    </div>
    <p class="card-sub">This register is maintained by your class teacher and cannot be edited here.</p>
    ${records.length===0 ? `<div class="empty"><b>No attendance recorded yet</b></div>` :
    `<div class="ledger"><table><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>
      ${records.map(r=>`<tr><td>${fmtDate(r.date)}</td><td><span class="badge ${r.status==='present'?'badge-present':'badge-absent'}">${r.status==='present'?'Present':'Absent'}</span></td></tr>`).join("")}

}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  document.querySelectorAll("[data-goto]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      uiState.loginError=null;
      view = el.dataset.goto;
      subview="";
      render();
    };
    el.onkeydown = (e)=>{
      if(e.key==="Enter" || e.key===" "){
        e.preventDefault();
        el.click();
      }
    };
  });

  const alf = document.getElementById("admin-login-form");
  if(alf) alf.onsubmit = async e=>{
    e.preventDefault();
    uiState.loginError = null;
    const email = document.getElementById("au").value.trim();
    const password = document.getElementById("ap").value;
    if(!supabaseClient){
      uiState.loginError = "Online authentication is unavailable. Please check your internet connection.";
      render(); return;
    }
    const submitBtn = alf.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent="Signing in..."; }
    try{
      const {data,error} = await supabaseClient.auth.signInWithPassword({email,password});
      if(error) throw error;
      authSession = data?.session || null;
      if(!authSession?.user){ throw new Error("Authentication succeeded but no session was returned."); }
      const {data:profile,error:profileError} = await supabaseClient
        .from("profiles")
        .select("id, role, display_name, auth_email")
        .eq("id", authSession.user.id)
        .maybeSingle();
      if(profileError) throw profileError;
      if(!profile){
        await supabaseClient.auth.signOut();
        throw new Error("Your account is authenticated, but no DLBS profile has been assigned to it yet.");
      }
      if(profile.role !== "admin"){
        await supabaseClient.auth.signOut();
        throw new Error("This account is not an Admin account.");
      }
      session = {
        role:"admin",
        displayName:profile.display_name || authSession.user.email || "Administrator",
        authUserId:authSession.user.id,
        email:authSession.user.email
      };
      await loadAll();
      view="app"; subview=""; uiState.loginError=null; render();
    }catch(err){
      console.error("Admin Supabase login failed",err);
      uiState.loginError = err?.message || "Unable to sign in. Please check your email and password.";
      render();
    }
  };

  const tlf = document.getElementById("teacher-login-form");
  if(tlf) tlf.onsubmit=e=>{
    e.preventDefault();
    const u=document.getElementById("tu")?.value.trim()||"", p=document.getElementById("tp")?.value||"";
    const selectedClass=document.getElementById("teacher-login-class")?.value||"", selectedSubject=document.getElementById("teacher-login-subject")?.value||"";
    uiState.teacherLoginClass=selectedClass; uiState.teacherLoginSubject=selectedSubject;
    if(!u||!p||!selectedClass){uiState.loginError="Enter your username, password, and select your class.";render();return false;}
    const lock=getLoginLock("teacher",u);
    if(lock.lockedUntil>Date.now()){uiState.loginError=loginLockMessage(lock);render();return false;}
    if(["Basic 7","Basic 8","Basic 9"].includes(selectedClass)&&!selectedSubject){uiState.loginError="For Basic 7–9, select your subject or role before logging in.";render();return false;}
    let teachers=Array.isArray(DB.teachers)?DB.teachers:[];
    try{const saved=localStorage.getItem("dlbs:teachers");if(saved){const parsed=JSON.parse(saved);if(Array.isArray(parsed))teachers=parsed;}}catch(err){}
    const t=teachers.find(x=>x&&String(x.username??"").trim().toLowerCase()===u.toLowerCase()&&String(x.password??"")===p);
    if(!t){
      const next=recordLoginFailure("teacher",u);
      uiState.loginError=next.lockedUntil>Date.now()?loginLockMessage(next):"Incorrect username or password. Check the details entered by the admin.";
      render();return false;
    }
    const assignedClasses=Array.isArray(t.classes)?t.classes:[];
    if(!assignedClasses.includes(selectedClass)){uiState.loginError=`You are not assigned to ${selectedClass}. Ask the admin to assign that class to your account.`;render();return false;}
    if(["Basic 7","Basic 8","Basic 9"].includes(selectedClass)){
      const assignedSubjects=(t.subjects&&Array.isArray(t.subjects[selectedClass]))?t.subjects[selectedClass]:[];
      if(!selectedSubject){uiState.loginError=`Select your assigned subject or role for ${selectedClass}.`;render();return false;}
      if(!assignedSubjects.includes(selectedSubject)){uiState.loginError=`Access denied: ${selectedSubject} is not assigned to you for ${selectedClass}. Ask the admin to check your teacher assignment.`;render();return false;}
    }
    clearLoginFailures("teacher",u);
    DB.teachers=teachers.map(x=>({...x,subjects:x.subjects||{}}));
    const loggedTeacher=DB.teachers.find(x=>x.id===t.id)||t;
    session={role:"teacher",displayName:loggedTeacher.name||"Teacher",classes:[selectedClass],subjects:teacherSubjectMap(loggedTeacher),teacherId:loggedTeacher.id,selectedSubject:selectedSubject||"",teacherRole:selectedSubject||(loggedTeacher.role||"FORM MASTER"),photoData:loggedTeacher.photoData||""};
    view="app";subview="";uiState.loginError=null;render();return false;
  };

  const teacherClassLoginSelect = document.getElementById("teacher-login-class");
  if(teacherClassLoginSelect){
    teacherClassLoginSelect.onchange = ()=>{
      uiState.teacherLoginClass = teacherClassLoginSelect.value;
      uiState.teacherLoginSubject = "";
      render();
    };
  }

  const slf = document.getElementById("student-login-form");
  if(slf) slf.onsubmit=async e=>{
    e.preventDefault();
    const name=document.getElementById("su")?.value.trim()||"", cls=document.getElementById("sc")?.value||"", pass=document.getElementById("sp")?.value||"";
    const identity=`${name}|${cls}`, lock=getLoginLock("student",identity);
    if(lock.lockedUntil>Date.now()){uiState.loginError=loginLockMessage(lock);render();return false;}
    if(!name||!cls||!pass){uiState.loginError="Enter the student's name, class, and password.";render();return false;}
    const submit=slf.querySelector('button[type="submit"]');
    if(submit){submit.disabled=true;submit.textContent="Signing in...";}
    try{
      await loadStudentDataRemote(name,cls,pass);
      const stu=DB.students[0];
      if(!stu){throw new Error("Student profile could not be loaded from the school database.");}
      clearLoginFailures("student",identity);
      session={role:"student",displayName:stu.name,student:{...stu,password:pass},photoData:stu.photoData||""};
      view="app";subview="";uiState.loginError=null;render();
    }catch(err){
      console.error("Student online login failed",err);
      const next=recordLoginFailure("student",identity);
      uiState.loginError=next.lockedUntil>Date.now()?loginLockMessage(next):(err?.message||"We couldn't load your student profile. Check the details and try again.");
      render();
    }
    return false;
  };

  const logout = document.getElementById("logout-btn");
  if(logout) logout.onclick = async ()=>{ try{ if(supabaseClient && authSession) await supabaseClient.auth.signOut(); }catch(e){ console.warn("Supabase sign-out failed",e); } authSession=null; session=null; view="landing"; subview=""; uiState={}; render(); };
  document.querySelectorAll("[data-password-eye]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.passwordEye;
      const text=document.querySelector(`[data-password-text="${CSS.escape(id)}"]`);
      const value=document.querySelector(`[data-password-value="${CSS.escape(id)}"]`);
      if(!text||!value)return;
      const hidden=text.dataset.hidden==="1";
      text.textContent=hidden?(value.textContent||"—"):"••••••••";
      text.dataset.hidden=hidden?"0":"1";
      btn.innerHTML=eyeIcon(hidden);
      btn.setAttribute("aria-label",hidden?"Hide password":"Show password");
      btn.title=hidden?"Hide password":"Show password";
    };
  });
  document.querySelectorAll("[data-login-eye]").forEach(btn=>{
    btn.onclick=()=>{
      const input=document.getElementById(btn.dataset.loginEye); if(!input)return;
      const show=input.type==="password"; input.type=show?"text":"password";
      btn.innerHTML=eyeIcon(show);
      btn.setAttribute("aria-label",show?"Hide password":"Show password");
      btn.title=show?"Hide password":"Show password";
    };
  });

  document.querySelectorAll("[data-subview]").forEach(el=>{
    el.onclick = ()=>{ subview = el.dataset.subview; render(); };
  });

  const rb = document.getElementById("refresh-btn");
  if(rb) rb.onclick = ()=> refresh(true);

  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick = ()=>{ uiState[el.dataset.tab] = el.dataset.val; render(); };
  });

  /* ---- ADMIN: students ---- */
  const acf = document.getElementById("admin-class-filter");
  if(acf) acf.onchange = ()=>{ uiState.adminClassFilter = acf.value; render(); };

  const addStuBtn = document.getElementById("add-student-btn");
  if(addStuBtn) addStuBtn.onclick = ()=> openAddStudentModal(uiState.adminClassFilter || CLASSES[0]);

  document.querySelectorAll("[data-reset-pass]").forEach(el=>{
    el.onclick = async ()=>{
      const stu = getStudent(el.dataset.resetPass);

      showToast(`New password for ${stu.name}: ${np}`);

  document.querySelectorAll("[data-remove-student]").forEach(el=>{

      await saveKey("students", DB.students);
      showToast("Student removed.");
      render();
    };
  });
  const autoGenBtn = document.getElementById("auto-gen-class-btn");
  if(autoGenBtn) autoGenBtn.onclick = async ()=>{

        if(totalBytes>12*1024*1024) throw new Error("The total media size is too large. Please use smaller files.");
        if(file.type.startsWith("image/")){
          const data=await fileToResizedDataUrl(file,1200,0.78);
          media.push({type:"image",data,name:file.name});
        }else if(file.type.startsWith("video/")){
          if(file.size>8*1024*1024) throw new Error(`Video "${file.name}" is larger than 8 MB.`);
          const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
          media.push({type:"video",data,name:file.name});
        }else{
          throw new Error(`Unsupported media file: ${file.name}`);
        }
      }
      const n = {
        id: uid("news"),
        title,
        message,
        media,
        countdownDate: document.getElementById("news-countdown").value || null,
        date: todayISO()
      };
      DB.news.push(n);
      await saveKey("news", DB.news);
      showToast("Announcement posted with media.");
      render();

  document.querySelectorAll("[data-delete-news]").forEach(el=>{

async function markAttendance(payload){
  const [studentId, status, cls, date] = payload.split("|");
  const student = getStudent(studentId);
  if(!student || student.class !== cls || student.status === "left") { showToast("This student is not in the selected class."); return; }
  // Teachers may only mark attendance for classes assigned to their own account.
  // Administrators retain access to every class.
  if(session?.role === "teacher" && !teacherClasses().includes(cls)){
    showToast("You can only mark attendance for your assigned class.");
    return;
  }
  if(session?.role !== "admin" && session?.role !== "teacher") return;
  DB.attendance[cls] = DB.attendance[cls] || {};
  DB.attendance[cls][date] = DB.attendance[cls][date] || {};
  DB.attendance[cls][date][studentId] = status;
  await saveKey("attendance", DB.attendance);
  render();
}

function calculateAgeFromDob(dob){
  if(!dob) return "";
  const birth = new Date(dob + "T00:00:00");
  if(Number.isNaN(birth.getTime())) return "";
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const monthDiff = today.getMonth() - birth.getMonth();
  if(monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) age--;
  return age >= 0 ? String(age) : "";
}

function downloadRegisterPdf(){
  const s = session.student;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF(); addSchoolLogoToPdf(doc);
  doc.setFontSize(16); doc.text(SCHOOL_NAME, 14, 18);
  doc.setFontSize(11); doc.text(`Attendance Register — ${s.name} (${s.class})`, 14, 26);
  let y = 38;
  doc.setFontSize(10);
  doc.text("Date", 14, y); doc.text("Status", 90, y); y+=6;
  doc.line(14,y-4,190,y-4);
  const records = [];
  Object.entries((DB.attendance[s.class]||{})).forEach(([date, rec])=>{
    if(rec[s.id]) records.push({date, status: rec[s.id]});
  });
  records.sort((a,b)=> new Date(a.date)-new Date(b.date));
  records.forEach(r=>{
    if(y>280){ doc.addPage(); y=20; }
    doc.text(fmtDate(r.date), 14, y);
    doc.text(r.status==="present"?"Present":"Absent", 90, y);
    y+=7;
  });
  doc.save(`${s.name.replace(/\s+/g,"_")}_register.pdf`);
}
function downloadReportPdf(){
  const s = session.student;
  const term = uiState.studentReportTerm || TERMS.find(t=>(DB.reports[s.id]||{})[t]?.approved);
  const rep = (DB.reports[s.id]||{})[term];
  if(!rep) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF(); addSchoolLogoToPdf(doc);
  doc.setFontSize(16); doc.text(SCHOOL_NAME, 14, 18);
  doc.setFontSize(11); doc.text(`Terminal Report — ${term}`, 14, 26);
  doc.setFontSize(10); doc.text(`Name: ${s.name}    Class: ${s.class}`, 14, 34);
  doc.text(`Position: ${rep.position||"-"}    Attendance: ${rep.attendanceSummary||"-"}`, 14, 40);
  let y = 52;
  doc.text("Subject", 14, y); doc.text("Score", 90, y); doc.text("Grade", 120, y); doc.text("Remark", 145, y);
  y+=4; doc.line(14,y,196,y); y+=6;
  (rep.subjects||[]).forEach(sub=>{
    if(y>270){ doc.addPage(); y=20; }
    doc.text(String(sub.name||""), 14, y);
    doc.text(String(sub.score||""), 90, y);
    doc.text(String(sub.grade||""), 120, y);
    doc.text(String(sub.remark||"").slice(0,28), 145, y);
    y+=7;
  });
  y+=8;
  doc.text(`Conduct: ${rep.conduct||"-"}`, 14, y); y+=7;
  doc.text(`Interest: ${rep.interest||"-"}`, 14, y); y+=7;
  const teacherLines = doc.splitTextToSize(`Teacher's remark: ${rep.teacherRemark||"-"}`, 180);
  doc.text(teacherLines, 14, y); y+= teacherLines.length*6+2;
  const headLines = doc.splitTextToSize(`Head teacher's remark: ${rep.headRemark||"-"}`, 180);
  doc.text(headLines, 14, y);
  doc.save(`${s.name.replace(/\s+/g,"_")}_${term.replace(/\s+/g,"_")}_report.pdf`);
}

function normalizeTeacherRecord(t){
  const dateOfBirth = t.dateOfBirth || t.dob || "";
  return {...t, subjects:t.subjects || {}, dateOfBirth, dob:dateOfBirth, age:t.age ?? (dateOfBirth ? calculateAgeFromDob(dateOfBirth) : ""), contact:t.contact || "", appointmentDate:t.appointmentDate || "", education:t.education || ""};
}
function genderLabel(g){
  const v=(g||"").toLowerCase();
  return v==="male"?"Male":v==="female"?"Female":"Not specified";
}
function teachersByClassGender(cls){
  return {
    Male: studentsInClass(cls).filter(s=>(s.gender||"").toLowerCase()==="male"),
    Female: studentsInClass(cls).filter(s=>(s.gender||"").toLowerCase()==="female"),
    "Not specified": studentsInClass(cls).filter(s=>!["male","female"].includes((s.gender||"").toLowerCase()))
  };
}
function openEditStudentModal(id){ uiState.editingStudent=id; uiState.showAddStudent=null; renderModals(); }
function openEditTeacherModal(id){ uiState.editingTeacher=id; uiState.showAddTeacher=null; renderModals(); }

const BOOK_DB_NAME="dlbsBookFiles";
const BOOK_STORE="files";
function openBookFileDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB unavailable")); return; }
    const req=indexedDB.open(BOOK_DB_NAME,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(BOOK_STORE)) req.result.createObjectStore(BOOK_STORE); };
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function saveBookFile(id,file){
  const db=await openBookFileDB();
  return new Promise((resolve,reject)=>{ const tx=db.transaction(BOOK_STORE,"readwrite"); tx.objectStore(BOOK_STORE).put(file,id); tx.oncomplete=()=>{db.close();resolve();}; tx.onerror=()=>{db.close();reject(tx.error);}; });
}
async function getBookFile(id){
  const db=await openBookFileDB();
  return new Promise((resolve,reject)=>{ const tx=db.transaction(BOOK_STORE,"readonly"); const req=tx.objectStore(BOOK_STORE).get(id); req.onsuccess=()=>{db.close();resolve(req.result||null);}; req.onerror=()=>{db.close();reject(req.error);}; });
}
async function deleteBookFile(id){
  try{ const db=await openBookFileDB(); await new Promise((resolve,reject)=>{const tx=db.transaction(BOOK_STORE,"readwrite");tx.objectStore(BOOK_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close(); }catch(e){}
}

const _baseAttachModalHandlers=attachModalHandlers;
attachModalHandlers=function(){
  _baseAttachModalHandlers();
  const studentDob=document.getElementById("detail-stu-dob");
  const studentAge=document.getElementById("detail-stu-age");
  if(studentDob && studentAge){
    const updateStudentAge=()=>{ studentAge.value=calculateAgeFromDob(studentDob.value); };
    studentDob.oninput=updateStudentAge;
    updateStudentAge();
  }
  const sf=document.getElementById("student-details-form");
  if(sf) sf.onsubmit=async e=>{
    e.preventDefault();
    const selectedClass=document.getElementById("detail-stu-class").value;
    if(session?.role === "teacher" && !teacherClasses().includes(selectedClass)){
      showToast("You can only add or edit students in your assigned class."); return;
    }
    const data={
      name:document.getElementById("detail-stu-name").value.trim(),
      class:selectedClass,
      gender:document.getElementById("detail-stu-gender").value,
      dateOfBirth:document.getElementById("detail-stu-dob").value,
      age:Number(calculateAgeFromDob(document.getElementById("detail-stu-dob").value)),
      parentContact:document.getElementById("detail-stu-parent").value.trim(),
      guardian:document.getElementById("detail-stu-guardian").value.trim()
    };
    if(uiState.editingStudent){
      DB.students=DB.students.map(s=>s.id===uiState.editingStudent?{...s,...data}:s);
      await saveKey("students",DB.students);
      showToast("Student information saved.");
    }else{
      const password=genPasscode(data.name);
      DB.students.push({id:uid("stu"),...data,password,status:"active"});
      await saveKey("students",DB.students);
      showToast(`Added ${data.name}. Passcode: ${password}`);
    }
    uiState.editingStudent=null; uiState.showAddStudent=null; render();
  };
  const cancelS=document.getElementById("cancel-student-details");
  if(cancelS) cancelS.onclick=()=>{uiState.editingStudent=null;uiState.showAddStudent=null;render();};

  const ts=document.getElementById("detail-t-classes");
  if(ts){ ts.onchange=populateEditTeacherSubjects; populateEditTeacherSubjects(); }
  const tf=document.getElementById("teacher-details-form");
  if(tf) tf.onsubmit=async e=>{
    e.preventDefault();
    const classes=Array.from(ts.selectedOptions).map(o=>o.value);
    if(!classes.length){showToast("Select at least one class for this teacher.");return;}
    const subjects={};
    ["Basic 7","Basic 8","Basic 9"].forEach(cls=>subjects[cls]=Array.from(document.querySelectorAll(`[data-edit-basic-subject="${cls}"]:checked`)).map(el=>el.value));
    const teacherDob=document.getElementById("detail-t-dob").value;
    const data={name:document.getElementById("detail-t-name").value.trim(),username:document.getElementById("detail-t-user").value.trim(),password:document.getElementById("detail-t-pass").value,dateOfBirth:teacherDob,dob:teacherDob,age:Number(calculateAgeFromDob(teacherDob)),contact:document.getElementById("detail-t-contact").value.trim(),appointmentDate:document.getElementById("detail-t-appointment").value,education:document.getElementById("detail-t-education").value.trim(),classes,subjects};
    if(uiState.editingTeacher){
      DB.teachers=DB.teachers.map(t=>t.id===uiState.editingTeacher?{...t,...data}:t);
      await saveKey("teachers",DB.teachers);
      showToast("Teacher information saved.");
    }else{
      DB.teachers.push({id:uid("tch"),...data});
      await saveKey("teachers",DB.teachers);
      showToast("Teacher account created and saved.");
    }
    uiState.editingTeacher=null;uiState.showAddTeacher=null;render();
  };
  const cancelT=document.getElementById("cancel-teacher-details");
  if(cancelT) cancelT.onclick=()=>{uiState.editingTeacher=null;uiState.showAddTeacher=null;render();};

  const bf=document.getElementById("book-upload-form");
  if(bf) bf.onsubmit=async e=>{
    e.preventDefault();
    const title=document.getElementById("book-title").value.trim();
    const className=document.getElementById("book-class").value;
    const file=document.getElementById("book-file").files[0];
    const url=document.getElementById("book-url").value.trim();
    if(!file && !url){showToast("Choose a local file or enter an internet source URL.");return;}
    if(!teacherClasses().includes(className)){showToast("You can only upload books for your assigned class.");return;}
    const id=uid("book");
    const base={id,title,className,teacherId:session.teacherId,teacherName:session.displayName,date:todayISO(),fileName:file?file.name:"",url:url||"",dataUrl:""};
    try{
      if(file){ await saveBookFile(id,file); }
      DB.books=DB.books||[]; DB.books.push(base); await saveKey("books",DB.books);
      showToast("Book saved and made available to students."); render();
    }catch(err){ showToast("The book could not be saved. Please try again or use an internet source URL."); }
  };
  document.querySelectorAll("[data-open-book]").forEach(el=>el.onclick=async()=>{
    const b=(DB.books||[]).find(x=>x.id===el.dataset.openBook); if(!b)return;
    try{
      if(b.dataUrl){ window.open(b.dataUrl,"_blank","noopener"); return; }
      if(b.fileName){ const file=await getBookFile(b.id); if(file){ const url=URL.createObjectURL(file); const w=window.open(url,"_blank"); if(w) setTimeout(()=>URL.revokeObjectURL(url),60000); return; } }
      if(b.url){ window.open(b.url,"_blank","noopener"); return; }
      showToast("This book file is not available.");
    }catch(e){ if(b.url) window.open(b.url,"_blank","noopener"); else showToast("This book could not be opened."); }
  });
  document.querySelectorAll("[data-delete-book]").forEach(el=>el.onclick=async()=>{
    if(!confirm("Delete this book?"))return;
    await deleteBookFile(el.dataset.deleteBook);
    DB.books=(DB.books||[]).filter(b=>b.id!==el.dataset.deleteBook);
    await saveKey("books",DB.books);render();
  });
  const of=document.getElementById("online-class-form");
  if(of) of.onsubmit=async e=>{
    e.preventDefault();
    DB.onlineClasses=DB.onlineClasses||[];
    DB.onlineClasses.push({id:uid("live"),title:document.getElementById("online-title").value.trim(),className:document.getElementById("online-class").value,date:document.getElementById("online-date").value,time:document.getElementById("online-time").value,zoom:document.getElementById("online-zoom").value.trim(),teacherId:session.teacherId,teacherName:session.displayName});
    await saveKey("onlineClasses",DB.onlineClasses);showToast("Online class saved.");render();
  };
  document.querySelectorAll("[data-delete-online]").forEach(el=>el.onclick=async()=>{
    if(!confirm("Delete this online class?"))return;
    DB.onlineClasses=(DB.onlineClasses||[]).filter(c=>c.id!==el.dataset.deleteOnline);
    await saveKey("onlineClasses",DB.onlineClasses);render();
  });
};

      if(b.url){ window.open(b.url,"_blank","noopener"); return; }
      showToast("This book file is not available.");

/* Ensure older saved records gain the new optional fields without changing existing data. */
const _baseLoadAll=loadAll;
loadAll=async function(){
  await _baseLoadAll();
  DB.students=(DB.students||[]).map(normalizeStudentRecord);
  DB.teachers=(DB.teachers||[]).map(normalizeTeacherRecord);
  DB.books=Array.isArray(DB.books)?DB.books:[];
  DB.onlineClasses=Array.isArray(DB.onlineClasses)?DB.onlineClasses:[];
  DB.graduatedStudents=Array.isArray(DB.graduatedStudents)?DB.graduatedStudents:[];
};

function bindFormMasterClassRule(){
  const sel=document.getElementById('detail-t-classes');
  if(!sel) return;
  const refresh=()=>{
    const classes=Array.from(sel.selectedOptions).map(o=>o.value).flatMap(expandTeacherClassGroup);
    const hasFM=formMasterCheckedForForm();
    const selectedBasic=classes.filter(c=>["Basic 7","Basic 8","Basic 9"].includes(c));
    // A Form Master is a single-class responsibility. Keep the other Basic 7–9
    // options disabled as soon as FORM MASTER is selected.
    Array.from(sel.options).forEach(o=>{
      const expanded=expandTeacherClassGroup(o.value);
      const isBasic=expanded.some(c=>["Basic 7","Basic 8","Basic 9"].includes(c));
      const isSelected=o.selected;
      o.disabled=hasFM && isBasic && !isSelected;
    });
    const warning=document.getElementById('form-master-class-warning');
    if(warning){
      warning.style.display=hasFM?'block':'none';
      warning.textContent='FORM MASTER selected: this teacher must be assigned to exactly ONE class. Do not select Basic 7–9 as a group.';
    }
  };

}

  const subjectInput=document.getElementById("teacher-login-subject");
  const subjectWrap=document.getElementById("teacher-login-subject-wrap");

  const refreshSubjectField=()=>{
    const isBasic=["Basic 7","Basic 8","Basic 9"].includes(classInput?.value||"");
    if(subjectWrap) subjectWrap.style.display=isBasic?"block":"none";
    if(subjectInput){ subjectInput.required=isBasic; if(!isBasic) subjectInput.value=""; }
    uiState.teacherLoginClass=classInput?.value||"";
    uiState.teacherLoginSubject=subjectInput?.value||"";
  };
  if(classInput) classInput.onchange=refreshSubjectField;
  if(subjectInput) subjectInput.onchange=()=>{uiState.teacherLoginSubject=subjectInput.value;};
  refreshSubjectField();

  tlf.onsubmit=async e=>{
    e.preventDefault();
    const username=(userInput?.value||"").trim();
    const pass=passInput?.value||"";
    const selectedClass=classInput?.value||"";
    const selectedSubject=subjectInput?.value||"";
    uiState.teacherLoginUsername=username;
    uiState.teacherLoginClass=selectedClass;
    uiState.teacherLoginSubject=selectedSubject;

    if(!username || !pass || !selectedClass){ uiState.loginError="Enter your username, passcode, and select your class."; render(); return false; }
    if(["Basic 7","Basic 8","Basic 9"].includes(selectedClass) && !selectedSubject){ uiState.loginError="For Basic 7–9, select your subject or role before logging in."; render(); return false; }
    if(!supabaseClient){ uiState.loginError="Online authentication is unavailable. Please check your internet connection."; render(); return false; }

    const submit=tlf.querySelector('button[type="submit"]');
    if(submit){submit.disabled=true;submit.textContent="Signing in...";}
    try{
      // The Edge Function validates the school username/passcode and prepares the
      // corresponding Supabase Auth account without exposing its internal email.
      const {data:boot,error:bootError}=await supabaseClient.functions.invoke("teacher-login-bootstrap",{body:{username,password:pass}});
      if(bootError) throw bootError;
      if(!boot?.success || !boot?.authEmail) throw new Error(boot?.error||"Teacher authentication could not be prepared.");

      const {data:authData,error:authError}=await supabaseClient.auth.signInWithPassword({email:boot.authEmail,password:pass});
      if(authError) throw authError;
      authSession=authData?.session||null;
      if(!authSession?.user) throw new Error("Authentication succeeded but no teacher session was returned.");

      const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("id,role,display_name,auth_email").eq("id",authSession.user.id).maybeSingle();
      if(profileError) throw profileError;
      if(!profile || profile.role!=="teacher"){
        await supabaseClient.auth.signOut();
        throw new Error("This account is not configured as a DLBS teacher account.");
      }

      // Teachers cannot directly SELECT the protected school_state table. Load only the
      // teacher-scoped data through the secure teacher-data Edge Function instead.
      const teacherRemote=await loadTeacherDataRemote();
      const teachers=Array.isArray(DB.teachers)?DB.teachers:[];
      const normalized=username.toLowerCase();
      const teacher=teachers.find(t=>t&&String(t.username||"").trim().toLowerCase()===normalized);
      if(!teacher){ await supabaseClient.auth.signOut(); throw new Error("Teacher profile could not be loaded from the school database."); }

      const assignedClasses=Array.isArray(teacher.classes)?teacher.classes.flatMap(expandTeacherClassGroup):[];
      if(!assignedClasses.includes(selectedClass)) throw new Error(`You are not assigned to ${selectedClass}. Ask the admin to assign that class to your account.`);
      if(["Basic 7","Basic 8","Basic 9"].includes(selectedClass)){
        const assignedSubjects=teacher.subjects&&Array.isArray(teacher.subjects[selectedClass])?teacher.subjects[selectedClass]:[];
        if(!assignedSubjects.includes(selectedSubject)) throw new Error(`You are not assigned to ${selectedSubject} for ${selectedClass}. Ask the admin to update your teacher account.`);
      }

      session={
        role:"teacher",
        displayName:teacher.name||profile.display_name||"Teacher",
        classes:assignedClasses,
        activeClass:selectedClass,
        subjects:teacherSubjectMap(teacher),
        activeSubject:selectedSubject,
        teacherId:teacher.id,
        authUserId:authSession.user.id,
        authEmail:profile.auth_email||boot.authEmail,
        photoData:teacher.photoData||""
      };
      view="app"; subview=""; uiState.loginError=null; render();
    }catch(err){
      console.error("Teacher Supabase login failed",err);
      uiState.loginError=err?.message||"Unable to sign in. Please check your username and passcode.";
      render();
    }finally{
      const b=document.querySelector('#teacher-login-form button[type="submit"]');
      if(b){b.disabled=false;b.textContent="Log in";}
    }
    return false;
  };
};

// Confirmed payments automatically receive a receipt number.
const _attachReceiptHandlers=attachHandlers;
attachHandlers=function(){
  _attachReceiptHandlers();
  document.querySelectorAll("[data-confirm-payment]").forEach(el=>{el.onclick=async()=>{const [sid,rid]=el.dataset.confirmPayment.split("|");DB.feeRecords[sid]=DB.feeRecords[sid].map(r=>r.id===rid?{...r,status:"confirmed",receiptNo:r.receiptNo||("DLBS-"+Date.now().toString().slice(-8))}:r);await saveKey("feeRecords",DB.feeRecords);showToast("Payment confirmed and receipt generated.");render();};});
  const payBtn=document.getElementById("paystack-pay-btn");
  if(payBtn) payBtn.onclick=()=>{
    const student=session.student;
    const email=(document.getElementById("online-pay-email")?.value||"").trim();
    const amount=Number(document.getElementById("online-pay-amount")?.value||0);
    if(!email){showToast("Enter a parent/guardian email address.");return;}
    if(!amount || amount<=0){showToast("Enter a valid amount.");return;}
    if(amount>Number(feeBalance(student.id).balance)){showToast("Amount cannot be greater than the outstanding balance.");return;}
    if(PAYSTACK_PUBLIC_KEY.includes("REPLACE_WITH_SCHOOL_PUBLIC_KEY")){showToast("Add the school's Paystack public key before taking payments.");return;}
    if(typeof PaystackPop==="undefined"){showToast("Paystack checkout could not load. Check your internet connection.");return;}
    payBtn.disabled=true;
    const reference="DLBS-"+Date.now()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
    try{
      const popup=new PaystackPop();
      popup.newTransaction({
        key:PAYSTACK_PUBLIC_KEY,
        email,
        amount:Math.round(amount*100),
        currency:"GHS",
        reference,
        metadata:{student_id:student.id,student_name:student.name,class_name:student.class},
        onSuccess:async(transaction)=>{
          const verifiedReference=transaction.reference||reference;
          showToast("Payment received. Verifying securely with Paystack...");
          try{
            const {data:verifyData,error:verifyError}=await supabaseClient.functions.invoke("process-paystack-payment",{
              body:{reference:verifiedReference,amount,currency:"GHS",student_id:student.id,student_name:student.name,class_name:student.class,email}
            });
            if(verifyError) throw verifyError;
            if(!verifyData?.verified) throw new Error(verifyData?.error||"Paystack could not verify this payment.");
            DB.feeRecords[student.id]=DB.feeRecords[student.id]||[];
            const existing=DB.feeRecords[student.id].find(r=>r.reference===verifiedReference);
            const record={id:existing?.id||uid("pay"),date:todayISO(),amount:Number(verifyData.amount||amount),method:"Paystack",reference:verifiedReference,status:"confirmed",type:"online",email,receiptNo:existing?.receiptNo||("DLBS-"+Date.now().toString().slice(-8))};
            if(existing){
              DB.feeRecords[student.id]=DB.feeRecords[student.id].map(r=>r.reference===verifiedReference?{...r,...record}:r);
            }else{
              DB.feeRecords[student.id].push(record);
            }
            await saveKey("feeRecords",DB.feeRecords);
            showToast("Payment verified successfully. Your payment is confirmed.");
            render();
          }catch(err){
            console.error("Paystack verification failed",err);
            DB.feeRecords[student.id]=DB.feeRecords[student.id]||[];
            if(!DB.feeRecords[student.id].some(r=>r.reference===verifiedReference)){
              DB.feeRecords[student.id].push({id:uid("pay"),date:todayISO(),amount:Number(amount),method:"Paystack",reference:verifiedReference,status:"pending",type:"online",email});
            }
            try{localStorage.setItem("dlbs:feeRecords",JSON.stringify(DB.feeRecords));}catch(e){}
            showToast("Payment succeeded at Paystack. It is awaiting portal confirmation; please refresh shortly.");
            payBtn.disabled=false; render();
          }
        },
        onCancel:()=>{payBtn.disabled=false;showToast("Payment was cancelled.");}
      });
    }catch(err){console.error(err);payBtn.disabled=false;showToast("Could not open Paystack checkout.");}
  };
};

function gradeFromScoreSafe(v){
  const n=Number(v); if(!Number.isFinite(n)) return '';
  if(n>=80)return 'A'; if(n>=70)return 'B'; if(n>=60)return 'C'; if(n>=50)return 'D'; if(n>=40)return 'E'; return 'F';
}
